# ==============================================================================
# BƯỚC 1: CÁC LỆNH BASH TẠO THƯ MỤC VÀ PHÂN QUYỀN HỆ THỐNG (Chạy trên VPS)
# ==============================================================================
#
# 1. Tạo cấu trúc thư mục web và logs tại /opt/my-app/
# sudo mkdir -p /opt/my-app/html /opt/my-app/logs
#
# 2. Tạo tệp tin index.html thử nghiệm
# echo "<h1>Welcome to Secure Web App</h1>" | sudo tee /opt/my-app/html/index.html
#
# 3. Phân quyền sở hữu đệ quy thuộc về user 'devops' và group 'www-data'
# sudo chown -R devops:www-data /opt/my-app
#
# 4. Phân quyền thư mục và tệp tin:
# - Thư mục: devops đọc/ghi/thực thi, www-data đọc/thực thi (750)
# - Tệp tin: devops đọc/ghi, www-data đọc (640)
# sudo find /opt/my-app -type d -exec chmod 750 {} \;
# sudo find /opt/my-app -type f -exec chmod 640 {} \;
#
# 5. Cấp quyền ghi cho group 'www-data' tại thư mục logs để Nginx tiến hành ghi log
# sudo chmod 775 /opt/my-app/logs
#
# ==============================================================================
# BƯỚC 2: CẤU HÌNH NGINX SERVER BLOCK (/etc/nginx/conf.d/my-app.conf)
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Chỉ định đường dẫn chứa mã nguồn web tĩnh
    root /opt/my-app/html;
    index index.html index.htm;

    # Cấu hình lưu trữ log truy cập và log lỗi tại thư mục an toàn /opt/my-app/logs/
    access_log /opt/my-app/logs/access.log;
    error_log  /opt/my-app/logs/error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}